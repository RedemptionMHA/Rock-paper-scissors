<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Play Rock Paper Scissors against the computer. A fun interactive game.">
        <meta name="theme-color" content="#191919">
        <link rel="manifest" href="manifest.json">
        <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%23191919' width='192' height='192'/><text x='50%' y='50%' font-size='100' fill='white' text-anchor='middle' dominant-baseline='middle' font-family='Arial'>RPS</text></svg>">
        <title>
            Rock Paper Scissors
        </title>
        
        <style>
            @keyframes slideInUp {
                from {
                    opacity: 0;
                    transform: translateY(20px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            @keyframes pulse {
                0%, 100% {
                    transform: scale(1);
                }
                50% {
                    transform: scale(1.05);
                }
            }

            @keyframes fadeOutFadeIn {
                0% {
                    opacity: 1;
                }
                50% {
                    opacity: 0;
                }
                100% {
                    opacity: 1;
                }
            }

            @keyframes resetPulse {
                0% {
                    transform: scale(1);
                }
                50% {
                    transform: scale(1.08);
                }
                100% {
                    transform: scale(1);
                }
            }

            body {
                background-color: rgb(25, 25, 25);
                font-family: Arial, sans-serif;
                text-align: center;
                margin-top: 50px;
                color: white;
            }

            .move-icon {
                
            }

            #rock, #paper, #scissors {
                background-color: transparent;
                border: none;
                border-radius: 50%;
                width: 120px;
                height: 120px;
                margin: 10px;
                cursor: pointer;
                transition: all 0.3s ease;
                border: 3px solid #ccc;
            }

            .title {
                font-size: 36px;
                font-weight: bold;
                margin-bottom: 20px;
            }

            #choices button {
                font-size: 20px;
                margin: 10px;
                padding: 10px 20px;
            }

            .js-scores {
                font-size: 25px;
                margin-top: 25px;
            }

            .score-number {
                display: inline-block;
                min-width: 30px;
                transition: all 0.4s ease;
            }

            .js-results {
                font-size: 28px;
                margin-top: 25px;
                font-weight: bold;
                min-height: 35px;
                color: #4CAF50;
                transition: all 0.4s ease;
                animation: slideInUp 0.6s ease;
            }

            .js-moves {
                font-size: 18px;
                margin-top: 20px;
                min-height: 80px;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 10px;
                transition: all 0.4s ease;
                animation: slideInUp 0.6s ease;
            }

            .js-moves img {
                transition: transform 0.3s ease;
            }

            .js-reset {
                margin-top: 30px;
                padding: 10px 20px;
                font-size: 16px;
                cursor: pointer;
                border-radius: 10px;
                border: none;
                background-color: #cecece;
                transition: all 0.3s ease;
            }

            .js-reset:hover {
                background-color: #b0b0b0;
                transform: translateY(-2px);
                box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            }

            .js-reset:active {
                transform: translateY(0);
            }

            #rock:hover, #paper:hover, #scissors:hover {
                transform: scale(1.15);
                border-color: white;
                box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            }

            #rock:active, #paper:active, #scissors:active {
                transform: scale(0.95);
            }
        </style>
    </head>
    <body>
        <!-- Page title / heading -->
        <p class="title">Rock Paper Scissors</p>

        <!--
            Choices area: three buttons that start a round.
            Each button calls playGame(...) with the player's move.
            Using simple strings here ('Rock', 'Paper', 'Scissors').
        -->
        <div id="choices">
            <button id="rock" onclick="playGame('Rock')"><img class="move-icon" data-move="Rock" alt="Rock"></button>

            <button id="paper" onclick="playGame('Paper')"><img class="move-icon" data-move="Paper" alt="Paper"></button>

            <button id="scissors" onclick="playGame('Scissors')"><img class="move-icon" data-move="Scissors" alt="Scissors"></button>
            <p class="js-scores">Wins: <span class="score-number" id="wins-score">0</span>, Losses: <span class="score-number" id="losses-score">0</span>, Ties: <span class="score-number" id="ties-score">0</span></p>
            <p class="js-results">Make your move to start!</p>
            <p class="js-moves">Pick Rock, Paper, or Scissors</p>

            <button onclick="resetScores()" class="js-reset">Reset scores</button>
        </div>

        <script>
            // Global state: stores computer's move for the current round.
            // Declared at top so it's available to all functions below.
            let computerMove = '';
            const scores = 
                JSON.parse(localStorage.getItem('rpsScores')) || { player: 0, computer: 0, ties: 0
            };

            updateScoresDisplay();
            
            // Embedded SVG icons so this file is self-contained (no external Icons/ folder needed)
            const ICON_SVGS = {
                Rock: `<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="48" height="48" version="1.1" id="svg1" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns="http://www.w3.org/2000/svg" xmlns:svg="http://www.w3.org/2000/svg"><defs><linearGradient id="linearGradient1"><stop style="stop-color:#f48a22;stop-opacity:1;" offset="0" id="stop1"/><stop style="stop-color:#ffb722;stop-opacity:1;" offset="1" id="stop2"/></linearGradient><linearGradient id="linearGradient2" x1="0.22071416" y1="23.543916" x2="47.307587" y2="23.543916" gradientUnits="userSpaceOnUse" xlink:href="#linearGradient1"/></defs><path fill="#3B4262" d="M45.06 12.22c-.642-8.096-9.734-7.269-9.734-7.269-3.837-6.765-9.832-1.865-9.832-1.865-4.606-6.63-10.38-.486-10.38-.486-9.957-1.074-9.571 7.066-9.571 7.066-.234 2.588 1.403 10.593 1.403 10.593-1.477-4.614-4.68-.784-4.68-.784-3.94 6.078-.975 9.405-.975 9.405 5.33 6.246 16.688 13.743 16.688 13.743 4.113 2.356 2.373 4.457 2.373 4.457l24.876-4.11.571-4.718c3.782-11.436-.739-26.032-.739-26.032z" style="fill:url(#linearGradient2)"/></svg>`,
                Paper: `<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="49" height="59" version="1.1" id="svg1" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns="http://www.w3.org/2000/svg" xmlns:svg="http://www.w3.org/2000/svg"><defs><linearGradient id="linearGradient1"><stop style="stop-color:#ffa203;stop-opacity:1;" offset="0" id="stop1"/><stop style="stop-color:#f48a38;stop-opacity:1;" offset="1" id="stop2"/></linearGradient><linearGradient id="linearGradient2" x1="0.59372392" y1="29.236005" x2="48.813167" y2="29.236005" gradientUnits="userSpaceOnUse" xlink:href="#linearGradient1"/></defs><path fill="#3B4262" d="M47.125 11.832a2.922 2.922 0 00-1.232-.198c-.57.04-1.029.271-1.302.65-1.604 2.248-2.919 6.493-3.979 9.905-.486 1.577-1.14 3.688-1.612 4.69-.493-2.807.064-13.09.28-17.05l.003-.064c.15-2.751.17-3.234.138-3.446-.238-1.509-.843-2.5-1.799-2.943-.966-.45-2.22-.25-3.572.563-.677.41-.865 1.816-1.446 8.19l-.002.028c-.32 3.502-1.058 11.566-1.965 12.91-1.023-1.88-2.431-12.555-3.039-17.176-.425-3.236-.673-5.094-.84-5.655-.35-1.176-1.83-2.176-3.295-2.232-1.22-.06-2.22.56-2.698 1.638-.894.995-.578 4.292.41 12.102.47 3.718 1.44 11.395.83 12.257-1.219-.133-3.31-4.942-6.215-14.299-.816-2.62-1.068-3.408-1.318-3.753-.494-1.202-2.172-2.129-3.676-2.024a3.183 3.183 0 00-.377.049c-.787.156-2.584.881-2.2 4.226 1.06 4.637 2.213 8.041 3.331 11.346l.023.066c.669 1.98 1.302 3.85 1.89 5.925 1.385 4.9.846 7.94.84 7.975-.046.312-.143.503-.288.57a.556.556 0 01-.195.045c-.44.03-1.098-.26-1.437-.45-.776-1.482-4.636-8.544-8.134-9.524l-.126-.037-.127.012c-1.283.121-2.226.606-2.803 1.441-.914 1.32-.535 3.002-.444 3.34l.052.12c.028.051 2.834 5.165 3.268 7.544.374 2.04 2.311 4.25 3.869 6.026l.064.073c.508.58.946 1.083 1.292 1.548 4.519 4.713 11.665 8.677 11.723 8.71.892.657 1.387 1.293 1.44 1.84a.798.798 0 01-.16.58l-.155.162.988.96 18.853-1.324.804-3.684c2.486-10.402 1.967-19.272 1.958-19.33.01-.327.706-3.483 1.266-6.033l.017-.065c1.117-5.08 2.505-11.4 2.772-13.803.116-1.028-.542-1.972-1.675-2.401z" style="fill:url(#linearGradient2);fill-opacity:1"/></svg>`,
                Scissors: `<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="51" height="58" version="1.1" id="svg1" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns="http://www.w3.org/2000/svg" xmlns:svg="http://www.w3.org/2000/svg"><defs><linearGradient id="linearGradient1"><stop style="stop-color:#f48a28;stop-opacity:1;" offset="0" id="stop1"/><stop style="stop-color:#f4a828;stop-opacity:1;" offset="1" id="stop2"/></linearGradient><linearGradient id="linearGradient2" x1="0.312" y1="28.716838" x2="50.89462" y2="28.716838" gradientUnits="userSpaceOnUse" xlink:href="#linearGradient1"/></defs><path fill="#3B4262" d="M13.971 25.702l6.012-8.415c-2.499-.415-7.088-.507-10.846 3.235C3.212 26.421.812 39.163.312 42.248L15.37 57.24c2.711-.232 14.713-1.827 26.279-13.34.122-.249 2.94-2.321.636-4.614-1.1-1.095-2.919-1.074-4.042.044-.572.57-1.461.577-2.021.02-.56-.557-.552-1.443.02-2.012l4.087-4.069c2.076-2.067.119-5.555-2.78-4.717l-3.345 2.851c-.611.53-1.52.439-2.022-.14-.519-.597-.408-1.503.183-2.013 11.687-10.208 9.98-8.979 17.5-15.995 2.809-2.329-.725-6.447-3.493-4.09L28.182 25.45c-.529.448-1.34.457-1.86-.02-.601-.517-.615-1.262-.222-1.85L38.787 3.944c1.854-2.5-1.795-5.277-3.749-2.757L16.28 27.307c-.452.65-1.364.8-1.985.345a1.377 1.377 0 01-.323-1.95z" style="fill:url(#linearGradient2)"/></svg>`
            };

            function svgToDataUri(svgString) {
                return 'data:image/svg+xml;utf8,' + encodeURIComponent(svgString);
            }

            // Populate any <img class="move-icon" data-move="..."> with embedded SVG data URIs
            document.addEventListener('DOMContentLoaded', () => {
                document.querySelectorAll('img.move-icon[data-move]').forEach(img => {
                    const move = img.getAttribute('data-move');
                    if (ICON_SVGS[move]) {
                        img.src = svgToDataUri(ICON_SVGS[move]);
                    }
                });
            });
                
            /**
             * updateScoresDisplay()
             * - Helper function to update the scores display on the page.
             * - Called whenever scores change.
             * - Only animates the scores that have changed.
             */
            function updateScoresDisplay() {
                const winsEl = document.querySelector('#wins-score');
                const lossesEl = document.querySelector('#losses-score');
                const tiesEl = document.querySelector('#ties-score');
                
                // Only animate if the value changed
                if (parseInt(winsEl.innerText) !== scores.player) {
                    winsEl.style.animation = 'none';
                    void winsEl.offsetWidth;
                    winsEl.innerText = scores.player;
                    winsEl.style.animation = 'fadeOutFadeIn 0.5s ease';
                }
                
                if (parseInt(lossesEl.innerText) !== scores.computer) {
                    lossesEl.style.animation = 'none';
                    void lossesEl.offsetWidth;
                    lossesEl.innerText = scores.computer;
                    lossesEl.style.animation = 'fadeOutFadeIn 0.5s ease';
                }
                
                if (parseInt(tiesEl.innerText) !== scores.ties) {
                    tiesEl.style.animation = 'none';
                    void tiesEl.offsetWidth;
                    tiesEl.innerText = scores.ties;
                    tiesEl.style.animation = 'fadeOutFadeIn 0.5s ease';
                }
            }

            function showResults(result) {
                const resultsEl = document.querySelector('.js-results');
                resultsEl.style.animation = 'none';
                
                // Trigger reflow to restart animation
                void resultsEl.offsetWidth;
                
                resultsEl.innerText = result;
                resultsEl.style.animation = 'slideInUp 0.6s ease';
                
                // Change color based on result
                if (result.includes('Win')) {
                    resultsEl.style.color = '#4CAF50';
                } else if (result.includes('Lose')) {
                    resultsEl.style.color = '#f44336';
                } else if (result.includes('Tie')) {
                    resultsEl.style.color = '#2196F3';
                }
            }

            function showMoves(playerMove, computerMove) {
                const movesEl = document.querySelector('.js-moves');
                movesEl.style.animation = 'none';
                
                // Trigger reflow to restart animation
                void movesEl.offsetWidth;
                
                movesEl.innerHTML = 
                    `You played <img src="${svgToDataUri(ICON_SVGS[playerMove])}" class="move-icon">, Computer played <img src="${svgToDataUri(ICON_SVGS[computerMove])}" class="move-icon">`;
                movesEl.style.animation = 'slideInUp 0.6s ease';
            }
            /**
             * resetScores()
             * - Resets all scores to 0 and updates the display immediately.
             */
            function resetScores() {
                const resetBtn = document.querySelector('.js-reset');
                resetBtn.style.animation = 'none';
                
                // Trigger reflow
                void resetBtn.offsetWidth;
                resetBtn.style.animation = 'resetPulse 0.5s ease';
                
                scores.player = 0;
                scores.computer = 0;
                scores.ties = 0;
                localStorage.removeItem('rpsScores');
                updateScoresDisplay();
            }

            /**
             * pickComputerMove()
             * - Helper (defined first): chooses the computer's move for the round.
             * - No inputs. Side effect: sets the global `computerMove` variable to
             *   one of 'Rock', 'Paper', or 'Scissors'. Uses Math.random() internally.
             *
             * Notes for testing:
             * - To make this deterministic in tests, consider returning the move
             *   instead of mutating a global, or accept an injected RNG.
             */
            function pickComputerMove() {
                const randomNumber = Math.random();

                if (randomNumber >= 0 && randomNumber < 1/3) {
                    computerMove = 'Rock';
                } else if (randomNumber >= 1/3 && randomNumber < 2/3) {
                    computerMove = 'Paper';
                } else {
                    computerMove = 'Scissors';
                }
            }

            /**
             * playGame(playerMove)
             * - Main function (defined after helpers): starts a round using the
             *   provided playerMove string ('Rock'|'Paper'|'Scissors').
             * - Side effects: calls pickComputerMove(), computes the result, and
             *   displays it via alert().
             * - Output: none (result shown via alert)
             *
             * Notes:
             * - Uses strict string matching; normalize inputs before calling if needed.
             */
            function playGame(playerMove) {
                // result will hold the outcome message for the round
                let result = '';

                // Choose computer move for this round (mutates `computerMove`).
                pickComputerMove();

                // Compare player's move vs computer's move and determine the result.
                if (playerMove === 'Rock') {
                    if (computerMove === 'Rock') { result = 'Tie!'; }
                    else if (computerMove === 'Paper') { result = 'You Lose!'; }
                    else if (computerMove === 'Scissors') { result = 'You Win!'; }
                } else if (playerMove === 'Paper') {
                    if (computerMove === 'Rock') { result = 'You Win!'; }
                    else if (computerMove === 'Paper') { result = 'Tie!'; }
                    else if (computerMove === 'Scissors') { result = 'You Lose!'; }
                } else if (playerMove === 'Scissors') {
                    if (computerMove === 'Rock') { result = 'You Lose!'; }
                    else if (computerMove === 'Paper') { result = 'You Win!'; }
                    else if (computerMove === 'Scissors') { result = 'Tie!'; }
                } else {
                    // Defensive: handle unexpected input values
                    result = 'Invalid move.';
                }

                if (result === 'You Win!') {
                    scores.player += 1;
                } else if (result === 'You Lose!') {
                    scores.computer += 1;
                } else if (result === 'Tie!') {
                    scores.ties += 1;
                }

                localStorage.setItem('rpsScores', JSON.stringify(scores));

                updateScoresDisplay();
                showMoves(playerMove, computerMove);
                showResults(result);
                // Show the outcome. Consider replacing this alert with an in-page element
                // for a better user experience (non-blocking and styleable).
            }

            // PWA Service Worker Registration
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js').catch(err => {
                    console.log('Service Worker registration failed:', err);
                });
            }
        </script>
    </body>
</html>
